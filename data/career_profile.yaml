    summary: >-
      Enables an AI Engineering job seeker to decide which roles deserve effort.
      Reviews job ads against a structured career profile, ranks fit,
      recommends application strategy, and drafts tailored CVs for human review
      — reducing repetitive search work while keeping decisions explainable.
    technologies:
      - Python
      - Pydantic
      - OpenAI APIs
      - PyTest
      - Git
    outcomes:
      - >-
        Delivers an explainable job-intelligence loop from profile through
        strategy and tailored CV drafts under owner review.
      - >-
        Uses golden validation suites and formal GO / NO-GO close-out for
        release-quality engineering decisions.
    url: null
    demonstrates:
      - Structured career profile model
      - Evidence-cited opportunity assessment
      - Deterministic application-strategy recommendation
      - Evidence-grounded CV generation pipeline
      - Golden validation suites with GO / NO-GO release gates
      - Human-in-the-loop review of generated outputs
